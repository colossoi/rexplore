[package]
name = "rexplore"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
rustdoc-types = "0.56.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
hashbag = { version = "0.1.12", default-features = false }
thiserror = "2.0"
